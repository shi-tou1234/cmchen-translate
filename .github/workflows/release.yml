name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            targets: --win nsis portable
          - os: macos-latest
            name: macos-arm64
            targets: --mac dmg zip --arm64
          - os: macos-13
            name: macos-x64
            targets: --mac dmg zip --x64
          - os: ubuntu-latest
            name: linux
            targets: --linux AppImage deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run stage:tessdata

      - run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.targets }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
