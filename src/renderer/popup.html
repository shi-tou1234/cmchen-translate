<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    :root { --accent: #6C5CE7; --accent2: #A29BFE; --bg: rgba(30,32,38,0.88); --card: rgba(40,42,50,0.92); --text: #E8E9ED; --dim: #8B8D97; --border: rgba(255,255,255,0.08); --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { background: transparent; font-family: -apple-system, 'SF Pro Display', system-ui, 'Microsoft YaHei', sans-serif; }
    body { height: 100vh; display: flex; align-items: flex-start; padding: 6px; animation: slideUp 0.22s cubic-bezier(.4,0,.2,1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }
    .card {
      display: flex; flex-direction: column; width: 100%; border-radius: var(--radius);
      background: var(--bg); backdrop-filter: blur(40px) saturate(1.5); -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset;
      overflow: hidden; min-height: 160px;
    }
    .head { display: flex; align-items: center; padding: 12px 16px; gap: 10px; }
    .head::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), #FD79A8); border-radius: var(--radius) var(--radius) 0 0;
    }
    .logo { width: 20px; height: 20px; flex-shrink: 0; border-radius: 5px; }
    .brand { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 0.3px; }
    .badge {
      margin-left: auto; background: rgba(108,92,231,0.25); color: var(--accent2);
      font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: 999px;
      border: 1px solid rgba(108,92,231,0.3); max-width: 180px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #close {
      border: none; background: rgba(255,255,255,0.06); color: var(--dim);
      width: 24px; height: 24px; border-radius: 8px; cursor: pointer;
      font-size: 13px; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    #close:hover { background: rgba(229,115,115,0.2); color: #E57373; }
    #original {
      user-select: text; margin: 10px 14px 0; padding: 10px 12px;
      font-size: 12.5px; line-height: 1.55; color: #A0A4AE; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 10px;
      max-height: 72px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    #original:empty { display: none; }
    #result {
      flex: 1; padding: 14px 16px; font-size: 17.5px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word; color: var(--text); user-select: text;
    }
    #result.err { color: #EF5350; font-size: 13px; line-height: 1.55; }
    .loading { color: var(--dim); font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .spin {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent); border-radius: 50%; animation: r 0.7s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    .foot {
      display: flex; align-items: center; padding: 8px 14px 10px;
      border-top: 1px solid var(--border); gap: 10px;
    }
    #meta { font-size: 11px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.btn {
      font-size: 12px; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--text);
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
    }
    button.btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.18); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    button.primary:hover { background: #7C6EF0; }
    button.btn svg { width: 13px; height: 13px; }
    #switchBanner {
      background: rgba(255,193,7,0.12); border: 1px solid rgba(255,193,7,0.25); color: #FFD54F;
      font-size: 11.5px; padding: 6px 12px; margin: 0 14px; border-radius: 8px;
      animation: slideDown 0.2s ease-out; display: none;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } }
    #toast {
      position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%);
      background: rgba(40,42,50,0.95); color: var(--text); font-size: 11.5px;
      padding: 5px 14px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="switchBanner"></div>
    <div class="head">
      <svg class="logo" viewBox="0 0 512 512"><rect x="32" y="32" width="448" height="448" rx="112" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#A29BFE"/></linearGradient></defs><rect x="84" y="112" width="228" height="156" rx="42" fill="#fff"/><path d="M148 258 L148 306 L206 258 Z" fill="#fff"/><text x="198" y="238" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="104" font-weight="700" fill="#4F46E5">文</text><rect x="240" y="248" width="196" height="140" rx="38" fill="#2D206B"/><path d="M372 378 L372 420 L322 378 Z" fill="#2D206B"/><text x="338" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="98" font-weight="700" fill="#fff">A</text></svg>
      <span class="brand">划译</span>
      <span class="badge" id="badge"></span>
      <button id="close" title="关闭 (Esc)">✕</button>
    </div>
    <div id="original"></div>
    <div id="result"></div>
    <div class="foot">
      <span id="meta"></span>
      <button class="btn" id="retryBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 2.6-6.3M4 3v5h5"/></svg>重试
      </button>
      <button class="btn primary" id="copyBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制译文
      </button>
    </div>
  </div>
  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
