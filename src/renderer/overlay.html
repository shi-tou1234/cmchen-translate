<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --accent: #6C5CE7; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { cursor: crosshair; }
    #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.42); backdrop-filter: blur(2px); }
    #sel {
      position: absolute; display: none;
      border: 2px solid var(--accent); background: rgba(108,92,231,0.10);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.5) inset;
    }
    body.editing #sel { border-color: #60A5FA; background: rgba(96,165,250,0.08); }
    .handle {
      position: absolute; width: 12px; height: 12px; display: none;
      background: #fff; border: 2px solid #60A5FA; border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4); z-index: 5;
    }
    .handle.nw { cursor: nwse-resize; } .handle.se { cursor: nwse-resize; }
    .handle.ne { cursor: nesw-resize; } .handle.sw { cursor: nesw-resize; }
    .handle.n, .handle.s { cursor: ns-resize; }
    .handle.e, .handle.w { cursor: ew-resize; }
    #size {
      position: absolute; display: none;
      background: rgba(255,255,255,0.95); color: #1A1C23; font-weight: 600;
      font: 600 12px/1 system-ui, sans-serif; padding: 4px 9px; border-radius: 6px;
      pointer-events: none; z-index: 6;
    }
    #bar {
      position: absolute; display: none; z-index: 7;
      background: rgba(20,20,25,0.95); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 5px; backdrop-filter: blur(16px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    #bar button {
      font: 12px/1 -apple-system, system-ui, sans-serif; color: #E8E9ED;
      background: transparent; border: none; border-radius: 8px;
      padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.15s;
    }
    #bar button:hover { background: rgba(255,255,255,0.10); }
    #bar button.primary { background: var(--accent); color: #fff; font-weight: 600; }
    #bar button.primary:hover { background: #7C6EF0; }
    #bar svg { width: 13px; height: 13px; }
    #hint {
      position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,25,0.95); backdrop-filter: blur(16px);
      color: #C0C2CA; font-size: 13px; padding: 9px 22px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: opacity 0.5s; pointer-events: none; z-index: 8;
    }
  </style>
</head>
<body>
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="bar">
    <button id="btnOk" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 18 20 6"/></svg>翻译
    </button>
    <button id="btnRedo" title="重新框选">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 2.6-6.3M4 3v5h5"/></svg>重框
    </button>
    <button id="btnCancel" title="取消 (Esc)">✕</button>
  </div>
  <div id="hint">拖拽框选要识别的区域 · 松开后可拖动手柄微调 · Enter 确认 · Esc 取消</div>
  <script src="overlay.js"></script>
</body>
</html>
