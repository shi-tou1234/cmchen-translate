<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <style>
    :root { --accent: #6C5CE7; --accent2: #A29BFE; --bg: #0F1014; --card: #1A1C23; --card-hover: #22252E; --text: #E8E9ED; --dim: #8B8D97; --border: rgba(255,255,255,0.06); --input-bg: #22252E; --input-border: rgba(255,255,255,0.08); --radius: 12px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'SF Pro Display', system-ui, 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    .hero {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #A855F7 100%);
      padding: 20px 24px; display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .hero .app-icon {
      width: 52px; height: 52px; border-radius: 14px; background-size: cover;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3); flex-shrink: 0;
    }
    .hero h1 { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 3px; }
    .hero p { color: rgba(255,255,255,0.75); font-size: 12px; line-height: 1.55; }
    .hero code { background: rgba(255,255,255,0.15); padding: 1px 5px; border-radius: 4px; color: #fff; font-size: 11px; }
    main { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 700px; }
    .section {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .section h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
    label.col { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #C0C2CA; }
    label.row { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text); padding: 3px 0; cursor: pointer; }
    input[type=text], input[type=password], input[type=number], textarea {
      font-size: 13px; padding: 8px 11px; border: 1px solid var(--input-border); border-radius: 8px;
      background: var(--input-bg); color: var(--text); font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,0.2); }
    textarea { resize: vertical; min-height: 52px; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .actions { display: flex; align-items: center; gap: 12px; }
    button { font-size: 13px; padding: 8px 18px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background: var(--card); color: var(--text); cursor: pointer; transition: all 0.15s; }
    button:hover { background: var(--card-hover); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(108,92,231,0.3); }
    button.primary:hover { background: #7C6EF0; transform: translateY(-1px); }
    #msg { font-size: 12px; min-height: 16px; transition: color 0.2s; }
    #msg.ok { color: #66BB6A; }
    #msg.err { color: #EF5350; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="app-icon" id="appIcon"></div>
    <div>
      <h1>划译 · 设置</h1>
      <p>任意软件里选中文本后：<code>Alt+Z</code> 或快速连按两次 <code>Ctrl+C</code> 弹出翻译；截图翻译按 <code>Alt+S</code>；「选中自动弹」默认关闭。只能使用 opencode 免费模型。</p>
    </div>
  </div>
  <main>
    <div class="section">
      <h2>翻译服务（opencode 免费模型）</h2>
      <label class="col">服务地址
        <input type="text" id="baseUrl" placeholder="https://opencode.ai/zen/v1" />
      </label>
      <label class="col">模型（可下拉选择，也可直接输入任意免费模型名）
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="model" list="modelList" placeholder="输入或选择模型名" style="flex:1;" />
          <datalist id="modelList"></datalist>
          <button id="refreshModels" type="button">刷新列表</button>
        </div>
      </label>
      <label class="col">API Key
        <input type="password" id="apiKey" placeholder="留空则自动读取 opencode 的 opencode-go key" />
      </label>
      <label class="col">单次翻译字数上限
        <input type="number" id="maxChars" min="100" max="20000" step="100" />
      </label>
    </div>

    <div class="section">
      <h2>触发方式</h2>
      <label class="row"><input type="checkbox" id="hotkeyEnabled" /> 选中文本后按快捷键翻译</label>
      <label class="row">快捷键 <input type="text" id="hotkey" style="width:120px" /> <span style="color:var(--dim);font-size:12px;">如 Alt+Z</span></label>
      <label class="row"><input type="checkbox" id="doubleCopyEnabled" /> 选中后快速连按两次 Ctrl+C 翻译</label>
      <label class="row"><input type="checkbox" id="autoPopupEnabled" /> 选中文字自动弹窗（拖选或双击后）</label>
      <label class="row"><input type="checkbox" id="ocrEnabled" /> 截图翻译（框选屏幕区域，识别图中文字并翻译，快捷键 Alt+S）</label>
      <label class="col">自动弹窗黑名单（进程名，逗号分隔；终端里模拟 Ctrl+C 会中断程序，建议保留默认）
        <textarea id="blacklist" placeholder="WindowsTerminal, powershell, cmd, conhost"></textarea>
      </label>
    </div>

    <div class="section">
      <h2>其他</h2>
      <label class="row"><input type="checkbox" id="autoStart" /> 开机自动启动</label>
    </div>

    <div class="actions">
      <button id="save" class="primary">保存设置</button>
      <span id="msg"></span>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
